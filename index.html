<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jacked & Tan 2.0 Partner Training Engine</title>
    <meta name="description" content="A mobile-first training app for partners built on the original GZCL Jacked & Tan 2.0 12-week powerbuilding curriculum." />
    <meta property="og:title" content="Jacked & Tan 2.0 Partner Training Engine" />
    <meta property="og:description" content="A mobile-first training app for partners built on the original GZCL Jacked & Tan 2.0 12-week powerbuilding curriculum." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f4f0e8" />
    <script>
      // Apply the last-used profile theme before first paint so the app never flashes the default colors.
      try {
        var papers = { lavender: '#f3eff9', blue: '#eef2f7', vermilion: '#f4f0e8' };
        var saved = localStorage.getItem('jnt2_color_theme');
        if (saved && papers[saved]) {
          document.documentElement.dataset.theme = saved;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', papers[saved]);
        }
      } catch (e) {}
    </script>
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="J&amp;T 2.0" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
  </head>
  <body class="bg-paper text-ink antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
