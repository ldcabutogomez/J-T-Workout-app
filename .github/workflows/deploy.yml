name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Public values by design (the anon key is only allowed to call the two sync functions). Set under
          # Settings > Secrets and variables > Actions > Variables. Leave unset to build without partner sync.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      # Browser tests run against the production build with a pinned clock. Non-blocking until they have proven
      # stable on CI for a while; then remove continue-on-error so a failure stops the deploy.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        continue-on-error: true
      - name: Browser tests
        run: npm run test:browser
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
